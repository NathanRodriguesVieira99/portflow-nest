apiVersion: 1

datasources:
  #  ============================================================================
  #  Métricas
  #  ============================================================================
  - name: Portflow-Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: "10s"
      exemplarTraceIdDestinations:
        - name: traceId
          datasourceUid: jaeger

  #  ============================================================================
  #  Logs
  #  ============================================================================
  - name: Portflow-Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: TraceId
          matcherRegex: '"traceId":"([a-f0-9]+)"'
          url: "$${__value.raw}"
          datasourceUid: tempo

  #  ============================================================================
  #  Traces
  #  ============================================================================
  - name: Portflow-Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
      tracesToMetrics:
        datasourceUid: prometheus
