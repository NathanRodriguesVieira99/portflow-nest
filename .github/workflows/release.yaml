name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate new version
        uses: TriPSs/conventional-changelog-action@v5
        with:
          preset: conventionalcommits
          skip-on-empty: false

  build-and-push-docker-images:
    runs-on: ubuntu-latest
    needs: generate-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .env file
        run: cp .env.example .env
        working-directory: ./services/container-service

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login on Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.repository_owner}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Fetch latest tag
        id: get_tag
        run: |
          git fetch --tags
          TAG=$(git describe --tags --abbrev=0)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        
      
      - name: Build and push Docker images
        uses: docker/build-push-action@v5.1.0
        with:
          context: .
          push: true
          file: ./services/container-service/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/nathanrodriguesvieira99/container-service:${{ steps.get_tag.outputs.tag }}
            ghcr.io/nathanrodriguesvieira99/container-service:latest
